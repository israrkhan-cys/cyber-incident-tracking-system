{% extends 'base.html' %}
{% block title %}Report Incident{% endblock %}

{% block content %}

<div class="page-header">
    <div>
        <a href="{{ url_for('index') }}" style="color:var(--text-muted); font-size:0.85rem; text-decoration:none;">
            ← Back to Dashboard
        </a>
        <h1 class="page-title" style="margin-top:0.4rem;">
            Report <span>Incident</span>
        </h1>
    </div>
</div>

<div style="max-width:720px;">
    <div class="card">
        <form method="POST">

            <!-- Title -->
            <div class="form-group">
                <label>Title</label>
                <input type="text" name="title" placeholder="Brief title describing the incident" required>
            </div>

            <!-- Description -->
            <div class="form-group">
                <label>Description</label>
                <textarea name="description" rows="5"
                    placeholder="Detailed description of what happened, what was affected, and any initial findings..."
                    style="resize:vertical;"></textarea>
            </div>

            <!-- Severity + Category row -->
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
                <div class="form-group">
                    <label>Severity</label>
                    <select name="severity" required>
                        <option value="" disabled selected>Select severity</option>
                        <option value="low">Low</option>
                        <option value="medium">Medium</option>
                        <option value="high">High</option>
                        <option value="critical">Critical</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Category</label>
                    <select name="category_id">
                        <option value="">— None —</option>
                        {% for cat in categories %}
                        <option value="{{ cat.category_id }}">{{ cat.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <!-- Assign To -->
            <div class="form-group">
                <label>Assign To</label>
                <select name="assigned_to">
                    <option value="">— Unassigned —</option>
                    {% for user in users %}
                    <option value="{{ user.user_id }}">
                        {{ user.username }} ({{ user.role }})
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="divider"></div>

            <div style="display:flex; gap:1rem; justify-content:flex-end;">
                <a href="{{ url_for('index') }}" class="btn btn-outline">Cancel</a>
                <button type="submit" class="btn btn-primary">Submit Incident</button>
            </div>

        </form>
    </div>
</div>

{% endblock %}
