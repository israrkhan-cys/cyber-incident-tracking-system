{% extends 'base.html' %}
{% block title %}Edit Incident #{{ incident.incident_id }}{% endblock %}

{% block content %}

<div class="page-header">
    <div>
        <a href="{{ url_for('incident_detail', incident_id=incident.incident_id) }}"
           style="color:var(--text-muted); font-size:0.85rem; text-decoration:none;">
            ← Back to Incident
        </a>
        <h1 class="page-title" style="margin-top:0.4rem;">
            Edit <span>Incident #{{ incident.incident_id }}</span>
        </h1>
    </div>
</div>

<div style="max-width:720px;">
    <div class="card">
        <form method="POST">

            <!-- Title -->
            <div class="form-group">
                <label>Title</label>
                <input type="text" name="title" value="{{ incident.title }}" required>
            </div>

            <!-- Description -->
            <div class="form-group">
                <label>Description</label>
                <textarea name="description" rows="5"
                    style="resize:vertical;">{{ incident.description or '' }}</textarea>
            </div>

            <!-- Severity + Status row -->
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
                <div class="form-group">
                    <label>Severity</label>
                    <select name="severity" required>
                        {% for level in ['low', 'medium', 'high', 'critical'] %}
                        <option value="{{ level }}" {{ 'selected' if incident.severity == level }}>
                            {{ level.capitalize() }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label>Status</label>
                    <select name="status" required>
                        {% for s in ['open', 'investigating', 'resolved', 'closed'] %}
                        <option value="{{ s }}" {{ 'selected' if incident.status == s }}>
                            {{ s.capitalize() }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <!-- Category + Assign To row -->
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
                <div class="form-group">
                    <label>Category</label>
                    <select name="category_id">
                        <option value="">— None —</option>
                        {% for cat in categories %}
                        <option value="{{ cat.category_id }}"
                            {{ 'selected' if incident.category_id == cat.category_id }}>
                            {{ cat.name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label>Assign To</label>
                    <select name="assigned_to">
                        <option value="">— Unassigned —</option>
                        {% for user in users %}
                        <option value="{{ user.user_id }}"
                            {{ 'selected' if incident.assigned_to == user.user_id }}>
                            {{ user.username }} ({{ user.role }})
                        </option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="divider"></div>

            <div style="display:flex; gap:1rem; justify-content:flex-end;">
                <a href="{{ url_for('incident_detail', incident_id=incident.incident_id) }}"
                   class="btn btn-outline">Cancel</a>
                <button type="submit" class="btn btn-primary">Save Changes</button>
            </div>

        </form>
    </div>
</div>

{% endblock %}
